<header class="app-topbar d-flex align-items-center gap-3">
 
  <button
    type="button"
    class="topbar-menu-btn d-lg-none"
    aria-label="Open menu"
    aria-controls="appSidebar">
    <svg class="icon" aria-hidden="true"><use href="/static/icons/menu.svg"></use></svg>
  </button>
 
  <div class="topbar-title-group flex-grow-1">
    <p class="topbar-title" id="chatTitle">{{ conversation.title }}</p>
    <p class="topbar-subtitle d-none d-lg-block">SmartBot Pro &middot; Last active just now</p>
  </div>
 
  <span class="topbar-badge d-none d-lg-inline-flex">Pro</span>

<input
    type="text"
    id="chatTitleInput"
    class="topbar-title-input d-none"
    value="{{ conversation.title }}"
    maxlength="50">
 
  <button type="button" id="renameConversationBtn" class="topbar-icon-btn" aria-label="Rename conversation">
    <svg class="icon" aria-hidden="true"><use href="/static/icons/edit.svg"></use></svg>
  </button>
 
</header>
