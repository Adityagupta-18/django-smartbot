<header class="app-topbar d-flex align-items-center gap-3">
 
  <button
    type="button"
    class="topbar-menu-btn d-lg-none"
    aria-label="Open menu"
    aria-controls="appSidebar">
    <svg class="icon" aria-hidden="true"><use href="/static/icons/menu.svg"></use></svg>
  </button>
 
  <div class="topbar-title-group flex-grow-1">
    <p class="topbar-title" id="chatTitle">{{ conversation.title }}</p>
    <p class="topbar-subtitle d-none d-lg-block">SmartBot Pro &middot; AI Assistant</p>
  </div>
 
  <span class="topbar-badge d-none d-lg-inline-flex">Pro</span>

<input
    type="text"
    id="chatTitleInput"
    class="topbar-title-input d-none"
    value="{{ conversation.title }}"
    maxlength="50">

  <div class="topbar-actions">  

    {% if conversation %}
    <button type="button" id="homeBtn" class="topbar-icon-btn home-button" aria-label="Go To Home">
      <svg class="icon" aria-hidden="true"><use href="/static/icons/home.svg"></use></svg>
    </button>

    <button type="button" id="renameConversationBtn" class="topbar-icon-btn renameconversation" aria-label="Rename conversation">
      <svg class="icon" aria-hidden="true"><use href="/static/icons/edit.svg"></use></svg>
    </button>

    <button type="button" id="deleteConversationBtn" class="topbar-icon-btn deleteconversation" aria-label="Delete conversation">
      <svg class="icon" aria-hidden="true"><use href="/static/icons/delete.svg"></use></svg>
    </button>
    {% endif %}
    

    {% if not conversation %} 
      <div class="theme-switcher" id="themeSwitcher">
        <div class="theme-opt" data-theme-opt="dark">
          <svg class="icon theme-opt-icon" aria-hidden="true"><use href="/static/svg/moon.svg"></use></svg>
          <p class="theme-opt-label">Dark</p>
        </div>
        <div class="theme-opt" data-theme-opt="light">
          <svg class="icon theme-opt-icon" aria-hidden="true"><use href="/static/svg/sun.svg"></use></svg>
          <p class="theme-opt-label">Light</p>
        </div>
      </div>
    {% endif %}

  </div>

</header>
